                        const MAX_HEIGHT = 200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {

                                height = MAX_HEIGHT;
                            }
                        }

                const updatedGrades = { ...grades };
                let importedCount = 0;

                lines.forEach(line => {
                    const parts = line.replace(/,/g, '\t').split('\t');
                    if (parts.length >= 2) {
                        const identifier = parts[0].trim();
                        const score = parseFloat(parts[1].trim());

                        const matched = students.find(s => s.nis === identifier || s.nisn === identifier || s.name.toLowerCase() === identifier.toLowerCase());
                        if (matched) {
                            const key = `${bulkInputYear}-${bulkInputSemester}`;
                            if (!updatedGrades[matched.id]) updatedGrades[matched.id] = {};
                            if (!updatedGrades[matched.id][key]) updatedGrades[matched.id][key] = {};
                            
                            updatedGrades[matched.id][key][bulkInputSubject] = score;
                            importedCount++;
                        }

                                            <td className="py-1 font-semibold">Tempat, Tanggal Lahir</td>
                                            <td>:</td>
                                            <td>{printData.student.pob}, {printData.student.dob}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-1 font-semibold">Kelas Tingkat</td>
                                            <td>:</td>
                                            <td className="font-bold">{printData.student.kelas}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-1 font-semibold">Nama Orang Tua (Ayah/Ibu)</td>
                                            <td>:</td>
                                            <td>{printData.student.ayah} / {printData.student.ibu}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-1 font-semibold">Alamat Lengkap</td>
                                            <td>:</td>
                                            <td>{printData.student.alamat || '-'}</td>
                                        </tr>
                                    </tbody>
                                </table>

                                {printData.mail.tipeSurat === 'Surat Keterangan Aktif' && (
                                    <p>Adalah benar-benar siswa aktif yang terdaftar di satuan pendidikan SDIT ANNIHAYAH pada Tahun Pelajaran {settings.activeAcademicYear || '2025/2026'}. Siswa tersebut di atas senantiasi menaati semua regulasi tata tertib sekolah.</p>
                                )}

                                {printData.mail.tipeSurat === 'Surat Pindah Siswa' && (
                                    <p>Telah resmi mengajukan pindah sekolah dari SDIT ANNIHAYAH menuju ke satuan pendidikan **{printData.mail.sekolahTujuan}** dikarenakan **{printData.mail.alasanPindah}**. Seluruh berkas administrasi dan riwayat akademik yang bersangkutan telah diserahterimakan.</p>
                                )}

                                {printData.mail.tipeSurat === 'Surat Kelakuan Baik' && (
                                    <p>Selama menempuh pendidikan di SDIT ANNIHAYAH, siswa tersebut memiliki catatan kepribadian yang sangat baik, sopan, rajin belajar, serta tidak pernah melakukan tindakan yang melanggar norma hukum maupun tata tertib kedisiplinan sekolah.</p>
                                )}

                                {printData.mail.tipeSurat === 'Surat Keterangan Lomba' && (
                                    <p>Diberikan tugas dan delegasi secara resmi oleh instansi sekolah untuk mewakili kontingen SDIT ANNIHAYAH dalam ajang perlombaan **{printData.mail.namaLomba}** tingkat **{printData.mail.tingkatLomba}** yang diselenggarakan di **{printData.mail.tempatLomba}** pada tanggal {printData.mail.tglPelaksanaan}.</p>
                                )}

                                {printData.mail.tipeSurat === 'Surat Penerimaan Siswa' && (
                                    <p>Berdasarkan Surat Permohonan Pindah Sekolah No. <strong>{printData.mail.noSuratAsal}</strong> dari <strong>{printData.mail.sekolahAsal}</strong>, dengan ini menyatakan menerima siswa tersebut di atas untuk menjadi siswa di SDIT ANNIHAYAH dan ditempatkan pada <strong>Kelas {printData.student.kelas}</strong> terhitung mulai tanggal {printData.mail.tanggal}.</p>
                                )}

                                {printData.mail.tipeSurat === 'Surat Kelulusan' && (
                                    <p>Berdasarkan hasil ujian sekolah dan rapat pleno dewan pendidik, siswa yang bersangkutan dinyatakan **LULUS** dari satuan pendidikan SDIT ANNIHAYAH dengan nomor Ijazah {printData.student.ijazahNo || '________________'} dan tanggal kelulusan {printData.student.tglLulus || '___________'}.</p>
                                )}

                                <p>{printData.mail.keteranganTambahan}</p>

                                <p>Demikian surat keterangan ini kami terbitkan dengan sebenarnya untuk dapat dipergunakan sebagaimana mestinya.</p>
                            </div>

                            {/* Signatures block */}
                            <div className="flex justify-between text-xs mt-16 pt-8 font-sans">
                                <div className="text-center w-1/3">
                                    {printData.mail.tipeSurat === 'Surat Pindah Siswa' ? (
                                        <>
                                            <p>Mengetahui,</p>
                                            <p className="font-bold mt-16">Orang Tua / Wali Siswa</p>
                                            <p className="text-[10px] text-slate-400">( Tanda Tangan & Nama Jelas )</p>
                                        </>
                                    ) : null}
                                </div>
                                <div className="text-center w-[45%]">
                                    <p>Karawang, {printData.mail.tanggal}</p>
                                    <p className="font-semibold text-slate-500 text-[10px] uppercase">Kepala SDIT ANNIHAYAH</p>
                                    <p className="font-bold mt-16 text-black underline">{settings.headmaster}</p>
                                    <p className="text-[10px] text-slate-500">NIP: -</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PRINT TEMPLATE: ALUMNI IJAZAH / SKL */}
                    {printData && printData.type === 'ijazah' && (
                        <div className="fixed inset-0 bg-white z-50 p-12 overflow-y-auto print-card-portrait block font-serif text-black leading-relaxed">
                            <div className="ijazah-border">
                                <div className="text-center border-b-2 border-green-800 pb-4 mb-6 font-sans flex items-center justify-between">
                                    <img src="logo s_page-0001.jpg" alt="Logo" className="w-16 h-16 object-contain" onError={(e) => e.target.style.display = 'none'} />
                                    <div className="flex-1 text-center">
                                        <h2 className="text-md font-bold uppercase tracking-wide">YAYASAN ANNIHAYAH</h2>
                                        <h1 className="text-lg font-black uppercase text-green-800">SDIT ANNIHAYAH</h1>
                                        <p className="text-[10px] text-slate-500 font-semibold">Desa Sukamerta Kecamatan Rawamerta - Karawang</p>
                                    </div>
                                    <div className="w-16"></div>
                                </div>

                                <div className="text-center mb-6">
                                    <h3 className="text-sm font-bold uppercase underline tracking-widest">SURAT KETERANGAN KELULUSAN (SKL)</h3>
                                    <p className="text-xs font-sans text-slate-600 mt-1 font-mono">No. Dokumen: {printData.student.ijazahNo || '___/SDIT-AN/SKL/___/2026'}</p>
                                </div>

                                <p className="text-xs text-justify font-sans mb-4">
                                    Kepala Sekolah SDIT ANNIHAYAH menerangkan secara resmi bahwa siswa tersebut di bawah ini telah menyelesaikan seluruh rangkaian beban pengajaran program pendidikan dasar dan dinyatakan <strong>LULUS</strong> dengan hasil evaluasi ujian kelulusan sebagai berikut:
                                </p>

                                {/* Structured Identity Profile */}
                                <div className="space-y-4 text-xs font-sans">
                                    <table className="w-[90%] mx-auto text-xs mb-4">
                                        <tbody>
                                            <tr className="border-b border-slate-100"><td className="w-1/3 py-1 font-semibold">Nama Lengkap Siswa</td><td className="w-4">:</td><td className="font-bold text-slate-900">{printData.student.name}</td></tr>
                                            <tr className="border-b border-slate-100"><td className="py-1 font-semibold">Nomor Induk Siswa (NIS)</td><td>:</td><td className="font-mono">{printData.student.nis}</td></tr>
                                            <tr className="border-b border-slate-100"><td className="py-1 font-semibold">NISN</td><td>:</td><td className="font-mono">{printData.student.nisn}</td></tr>
                                            <tr className="border-b border-slate-100"><td className="py-1 font-semibold">Tempat, Tanggal Lahir</td><td>:</td><td>{printData.student.pob}, {printData.student.dob}</td></tr>
                                            <tr className="border-b border-slate-100"><td className="py-1 font-semibold">Nama Orang Tua / Wali</td><td>:</td><td>{printData.student.ayah} / {printData.student.ibu}</td></tr>
                                        </tbody>
                                    </table>

                                    <h4 className="font-bold border-b pb-1 text-slate-700 text-[11px] uppercase tracking-wider">Nilai Evaluasi Kelulusan Siswa</h4>
                                    <table className="w-[90%] mx-auto border-collapse border border-slate-300 text-center text-xs">
                                        <thead>
                                            <tr className="bg-slate-100">
                                                <th className="border border-slate-300 px-3 py-2 text-left">Aspek Evaluasi Kelulusan</th>
                                                <th className="border border-slate-300 px-3 py-2 w-32">Nilai Angka</th>
                                                <th className="border border-slate-300 px-3 py-2 w-48">Keterangan Capaian</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td className="border border-slate-300 px-3 py-2 text-left font-semibold">1. Evaluasi Ujian Tulis Resmi</td>
                                                <td className="border border-slate-300 px-3 py-2 font-mono font-bold text-slate-800">{printData.student.nilaiUjianTulis || 0}</td>
                                                <td className="border border-slate-300 px-3 py-2 text-[10px] text-slate-500">Lulus Evaluasi Teori Akademis</td>
                                            </tr>
                                            <tr>
                                                <td className="border border-slate-300 px-3 py-2 text-left font-semibold">2. Evaluasi Ujian Praktek / Skill</td>
                                                <td className="border border-slate-300 px-3 py-2 font-mono font-bold text-slate-800">{printData.student.nilaiUjianPraktek || 0}</td>
                                                <td className="border border-slate-300 px-3 py-2 text-[10px] text-slate-500">Lulus Evaluasi Praktek Kompetensi</td>
                                            </tr>
                                            <tr>
                                                <td className="border border-slate-300 px-3 py-2 text-left font-semibold">3. Tes Kemampuan Akademik (TKA)</td>
                                                <td className="border border-slate-300 px-3 py-2 font-mono font-bold text-slate-800">{printData.student.nilaiTKA || 0}</td>
                                                <td className="border border-slate-300 px-3 py-2 text-[10px] text-slate-500">Lulus Evaluasi Karakter & TKA</td>
                                            </tr>
                                            <tr className="bg-green-50 font-bold">
                                                <td className="border border-slate-300 px-3 py-2 text-left text-green-950 font-black">RATA-RATA EVALUASI KELULUSAN</td>
                                                <td className="border border-slate-300 px-3 py-2 font-mono text-green-900 text-sm font-black">
                                                    {(((parseFloat(printData.student.nilaiUjianTulis) || 0) + (parseFloat(printData.student.nilaiUjianPraktek) || 0) + (parseFloat(printData.student.nilaiTKA) || 0)) / 3).toFixed(1)}
                                                </td>
                                                <td className="border border-slate-300 px-3 py-2 text-[10px] text-green-800 font-bold">Sangat Memuaskan</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                {/* Signatures & Passport Photo Box */}
                                <div className="flex justify-between items-end pt-12 text-xs font-sans">
                                    {/* Passport Photo Stamp watermark for Cap Tiga Jari */}
                                    <div className="w-24 h-32 border-2 border-slate-400 flex flex-col items-center justify-center relative bg-slate-50 text-slate-400 text-[10px] font-bold">
                                        {printData.student.photo ? (
                                            <img src={printData.student.photo} alt="Student Pas Foto" className="w-full h-full object-cover" />
                                        ) : (
                                            <span className="text-center p-1">Pas Foto 3x4</span>
                                        )}
                                        <div className="absolute inset-0 bg-transparent flex items-center justify-center pointer-events-none">
                                            <span className="text-[7px] text-red-500/25 font-black uppercase rotate-45 border-2 border-dashed border-red-500/25 p-1">Cap Tiga Jari</span>
                                        </div>
                                    </div>

                                    <div className="text-center w-1/3">
                                        <p className="text-slate-400">Mengetahui,</p>
                                        <p className="font-bold mt-16 text-black">Orang Tua / Wali Siswa</p>
                                        <p className="text-[9px] text-slate-400">( Tanda Tangan )</p>
                                    </div>

                                    <div className="text-center w-1/3">
                                        <p>Karawang, {printData.student.tglLulus || settings.printTranscriptDate}</p>
                                        <p className="font-semibold text-slate-500 text-[9px] uppercase">Kepala SDIT ANNIHAYAH</p>
                                        <p className="font-bold mt-16 text-black underline">{settings.headmaster}</p>
                                        <p className="text-[9px] text-slate-500">NIP: -</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
